[package]
name = "night-authority"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }

[features]
local-demo = ["near-sdk/unit-testing"]

[[bin]]
name = "local-demo"
path = "src/demo.rs"
required-features = ["local-demo"]
